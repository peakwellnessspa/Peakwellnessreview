<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Feedback - Peak Wellness Spa, Mount Abu</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #141210;
    color: #f5f5f4;
    margin: 0;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1f1c19;
    border: 1px solid #38332e;
    border-radius: 18px;
    padding: 24px 20px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    text-align: center;
  }
  .brand { font-size: 24px; font-weight: 700; color: #fafaf9; margin: 0; letter-spacing: 0.4px; }
  .sub { font-size: 11px; color: #a8a29e; letter-spacing: 1.5px; text-transform: uppercase; margin: 5px 0 12px; }
  .badge {
    display: inline-block;
    background: #2e2924;
    color: #facc15;
    border: 1px solid #4a4238;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .chips-label { font-size: 12px; color: #a8a29e; margin-bottom: 8px; text-align: left; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .chip {
    background: #292524;
    color: #d6d3d1;
    border: 1px solid #44403c;
    padding: 6px 11px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
  }
  .chip.active {
    background: #16a34a;
    color: #ffffff;
    border-color: #16a34a;
    font-weight: 600;
  }
  .review-box {
    background: #141210;
    border: 1px solid #38332e;
    border-radius: 12px;
    padding: 15px;
    font-size: 14.5px;
    line-height: 1.6;
    color: #e7e5e4;
    text-align: left;
    min-height: 135px;
    margin-bottom: 14px;
    user-select: all;
  }
  .btn-main {
    background: #16a34a;
    color: #ffffff;
    border: none;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 10px;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(22, 163, 74, 0.35);
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .btn-sec {
    flex: 1;
    background: #292524;
    color: #e7e5e4;
    border: 1px solid #44403c;
    padding: 11px 10px;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
  }
  .status {
    font-size: 12px;
    color: #4ade80;
    margin-top: 10px;
    min-height: 16px;
  }
  .footer {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #2e2924;
    font-size: 11.5px;
    color: #78716c;
  }
</style>
</head>
<body>
<div class="card">
  <h1 class="brand">Peak Wellness Spa</h1>
  <div class="sub">Mount Abu - Relax - Rejuvenate - Recharge</div>
  <div class="badge">5.0 Top-Rated Wellness Spa</div>

  <div class="chips-label">Select Massage Therapy (Optional):</div>
  <div class="chips" id="chipContainer">
    <button class="chip active" onclick="setFilter('all', this)">All Therapies</button>
    <button class="chip" onclick="setFilter('deeptissue', this)">Deep Tissue</button>
    <button class="chip" onclick="setFilter('swedish', this)">Swedish</button>
    <button class="chip" onclick="setFilter('aroma', this)">Aroma</button>
    <button class="chip" onclick="setFilter('thai', this)">Thai Dry</button>
    <button class="chip" onclick="setFilter('fourhand', this)">Four Hand</button>
    <button class="chip" onclick="setFilter('gelcream', this)">Gel & Cream</button>
  </div>

  <div class="review-box" id="reviewText"></div>

  <button class="btn-main" onclick="copyAndOpenGoogle()">Copy Review & Open Google</button>
  <div class="btn-row">
    <button class="btn-sec" onclick="generateReview()">New Unique Review</button>
    <button class="btn-sec" onclick="copyOnly()">Copy Text Only</button>
  </div>
  <div class="status" id="statusMsg"></div>

  <div class="footer">
    Near Hotel Hilton, Mount Abu | Call/WhatsApp: 7014007710
  </div>
</div>

<script>
// NICHE APNA GOOGLE REVIEW LINK PASTE KAREIN
const GOOGLE_REVIEW_LINK = "https://g.page/r/CZOGR17oh1dyEBE/review";

const openings = [
  "Hands down the best spa in Mount Abu!",
  "Top-rated body massage center in Mount Abu!",
  "Had an unforgettable full body massage at Peak Wellness Spa, Mount Abu.",
  "If you are looking for the best body massage near me in Mount Abu, visit Peak Wellness Spa.",
  "Without a doubt the #1 wellness spa in Mount Abu!",
  "Amazing relaxation experience at Peak Wellness Spa near Hotel Hilton, Mount Abu.",
  "Truly a 5-star massage spa in Mount Abu!",
  "Best full body massage therapy in Mount Abu!",
  "Visited Peak Wellness Spa in Mount Abu and experienced top-level relaxation.",
  "One of the finest and cleanest body massage centers in Mount Abu!"
];

const therapyLines = {
  all: [
    "Their Deep Tissue and Swedish massage melted away all my travel fatigue and muscle pain.",
    "Tried their Aroma massage and Traditional Thai dry massage - pure bliss and total relaxation.",
    "The Four Hand massage and Cream massage were super rejuvenating and deeply soothing.",
    "Their Gel massage and Swedish relaxation therapy left me feeling completely refreshed.",
    "Opted for a Deep Tissue and Aroma therapy session, and the pressure point technique was spot-on.",
    "Their Thai massage and Cream body massage are a must-try for anyone visiting Mount Abu.",
    "Loved the Four Hand therapy and Gel massage - best stress relief experience ever.",
    "Their full body Swedish and Deep Tissue massage gave instant relief from back and neck stiffness."
  ],
  deeptissue: [
    "Their Deep Tissue massage in Mount Abu worked wonders on my stiff shoulders and lower back pain.",
    "Opted for a 60-minute Deep Tissue body massage and felt instant relief from travel fatigue.",
    "Best Deep Tissue massage therapy in Mount Abu - the therapist knew exact pressure points."
  ],
  swedish: [
    "Their relaxing Swedish full body massage melted away all stress and left me energized.",
    "Best Swedish massage in Mount Abu with smooth, rhythmic strokes and calming essential oils.",
    "Took a full body Swedish therapy session at Peak Wellness Spa and slept like a baby afterwards."
  ],
  aroma: [
    "Their Aromatherapy full body massage with soothing essential oils was pure heaven.",
    "Best Aroma massage in Mount Abu - the fragrance and gentle therapy completely calmed my mind.",
    "Loved the Aroma body massage session; it refreshed both my body and mood instantly."
  ],
  thai: [
    "Their Traditional Thai dry massage and body stretching relieved all my muscle tightness.",
    "Authentic Thai massage in Mount Abu! Felt super light, flexible, and completely recharged.",
    "Best Thai dry massage therapy in Mount Abu - truly professional technique and great comfort."
  ],
  fourhand: [
    "Tried their luxury Four Hand massage in Mount Abu - synchronized therapy at its absolute best!",
    "The Four Hand full body massage was an extraordinary, deeply relaxing spa experience.",
    "Best Four Hand massage center in Mount Abu - unmatched coordination and total body relaxation."
  ],
  gelcream: [
    "Loved their soothing Gel and Cream body massage - left my skin hydrated and muscles relaxed.",
    "Their Cream massage and Gel therapy are super smooth, refreshing, and deeply calming.",
    "Best Gel and Cream full body massage in Mount Abu for complete relaxation and skin nourishment."
  ]
};

const staffAndHygiene = [
  "The therapists are certified, experienced, and have a very polite and welcoming nature.",
  "100% hygienic and sanitized rooms with fresh towels, calm ambiance, and super humble staff behavior.",
  "Very friendly, respectful, and skilled therapists who truly care about customer comfort.",
  "Spotless cleanliness, peaceful environment, and top-level hospitality from the entire team.",
  "Their polite nature, professional attitude, and soothing ambiance make this place stand out.",
  "Clean, calm, and well-maintained spa rooms with expert therapists and warm hospitality.",
  "Humble staff behavior, punctual service, and a very peaceful atmosphere inside the spa.",
  "The therapist nature is super courteous and attentive to pressure preferences throughout the session."
];

const closings = [
  "Highly recommended to everyone in Mount Abu!",
  "Definitely the best spa experience - will visit again soon!",
  "5 out of 5 stars for service, hygiene, and therapist skills!",
  "A must-visit wellness center in Mount Abu for complete relaxation.",
  "Best value for money and top-notch quality!",
  "Truly deserves to be the top-rated massage center in Mount Abu.",
  "If you want a genuine, relaxing body massage in Mount Abu, this is the place!",
  "Will surely recommend Peak Wellness Spa to friends and family visiting Mount Abu."
];

let selectedCategory = "all";
let currentReview = "";

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function setFilter(cat, btn) {
  selectedCategory = cat;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  generateReview();
}

function generateReview() {
  const pool = therapyLines[selectedCategory] || therapyLines.all;
  currentReview = pick(openings) + " " + pick(pool) + " " + pick(staffAndHygiene) + " " + pick(closings);
  document.getElementById("reviewText").innerText = currentReview;
  document.getElementById("statusMsg").innerText = "";
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

function copyOnly() {
  copyText(currentReview);
  document.getElementById("statusMsg").innerText = "Copied! Now paste it on Google Reviews.";
}

function copyAndOpenGoogle() {
  copyText(currentReview);
  document.getElementById("statusMsg").innerText = "Review Copied! Opening Google...";
  setTimeout(() => {
    window.location.href = GOOGLE_REVIEW_LINK;
  }, 400);
}

generateReview();
</script>
</body>
</html>
